<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WORK</title>
<style>
  :root {
    --ink: #111111;
    --paper: #ffffff;
    --muted: #8a8a8a;
    --gap: 6px;
    --page-margin: 60px;
    --textlogo-height: 140px;
  }

  * {
    box-sizing: border-box;
    font-family: Helvetica, Arial, sans-serif;
    font-weight: 700;
    text-transform: lowercase;
    letter-spacing: -0.02em;
  }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--paper);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- Nav ---------- */
  header {
    position: relative;
    display: flex;
    justify-content: center;
    padding: 34px 20px 26px;
  }

  #logo {
    position: absolute;
    left: 20px;
    top: 50%;
    transform: translateY(-50%);
    height: 48px;
    width: auto;
    display: block;
  }

  #logo.hidden { display: none; }

  nav {
    display: flex;
    gap: 34px;
    flex-wrap: wrap;
    justify-content: center;
  }

  nav a {
    color: var(--ink);
    text-decoration: none;
    font-size: 12px;
    padding-bottom: 4px;
    border-bottom: 1px solid transparent;
    transition: border-color 0.2s ease;
    cursor: pointer;
  }

  nav a:hover,
  nav a.active {
    border-bottom: 1px solid var(--ink);
  }

  /* ---------- Main Container ---------- */
  main {
    max-width: 1400px;
    margin: 0 auto;
    padding: 0 var(--page-margin) 80px;
  }

  @media (max-width: 639px) {
    main { padding-left: 20px; padding-right: 20px; }
  }

  /* ---------- Home Gallery ---------- */
  #gallery {
    column-count: 1;
    column-gap: var(--gap);
  }

  @media (min-width: 640px) {
    #gallery { column-count: 2; }
  }
  @media (min-width: 980px) {
    #gallery { column-count: 3; }
  }
  @media (min-width: 1360px) {
    #gallery { column-count: 4; }
  }

  figure {
    margin: 0 0 var(--gap);
    break-inside: avoid;
    display: block;
  }

  /* Full-width elements break column flow and require top/bottom margins to match column gaps */
  figure.media-video {
    column-span: all;
    margin-top: var(--gap);
    margin-bottom: var(--gap);
  }

  figure.media-textlogo {
    column-span: all;
    text-align: center;
    margin-top: var(--gap);
    margin-bottom: var(--gap);
  }

  figure.media-textlogo img {
    display: inline-block;
    width: auto;
    max-width: 100%;
    height: auto;
    max-height: var(--textlogo-height);
    opacity: 0;
    transition: opacity 0.4s ease;
  }

  figure.media-textlogo img.loaded {
    opacity: 1;
  }

  figure a {
    display: block;
    position: relative;
    overflow: hidden;
    background: #f4f4f4;
  }

  figure img,
  figure video {
    display: block;
    width: 100%;
    height: auto;
    transition: opacity 0.4s ease, transform 0.6s ease, filter 0.35s ease;
    opacity: 0;
  }

  figure img.loaded,
  figure video.loaded {
    opacity: 1;
  }

  figure a:hover img {
    filter: blur(6px);
    transform: scale(1.03);
  }

  .caption-overlay {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
    color: #ffffff;
    font-weight: 700;
    font-size: 14px;
    background: rgba(0, 0, 0, 0.15);
    opacity: 0;
    transition: opacity 0.3s ease;
    pointer-events: none;
  }

  figure a:hover .caption-overlay {
    opacity: 1;
  }

  .sound-prompt {
    position: absolute;
    right: 14px;
    bottom: 14px;
    background: rgba(17, 17, 17, 0.75);
    color: #fff;
    font-size: 11px;
    padding: 8px 12px;
    border: none;
    cursor: pointer;
    z-index: 2;
  }

  .sound-prompt.hidden { display: none; }

  .video-frame {
    position: relative;
    width: 100%;
    padding-top: 56.25%; /* 16:9 */
    background: #000;
  }

  .video-frame iframe,
  .video-frame video {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    border: 0;
  }

  /* ---------- Music Section ---------- */
  #music-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 48px;
    padding-top: 20px;
  }

  .music-item {
    width: 33.333%; /* 1/3 of total page width */
    min-width: 280px; /* fallback for small mobile screens */
    max-width: 100%;
    text-align: center;
  }

  .music-item a {
    text-decoration: none;
    color: var(--ink);
    display: block;
  }

  .music-title {
    font-size: 18px;
    margin-bottom: 12px;
    transition: opacity 0.2s ease;
  }

  .music-cover-wrap {
    width: 100%;
    background: #f4f4f4;
    overflow: hidden;
  }

  .music-cover {
    width: 100%;
    height: auto;
    display: block;
    opacity: 0;
    transition: opacity 0.4s ease, transform 0.4s ease;
  }

  .music-cover.loaded {
    opacity: 1;
  }

  .music-item a:hover .music-title {
    opacity: 0.7;
  }

  .music-item a:hover .music-cover {
    transform: scale(1.02);
  }

  /* ---------- Shows Section ---------- */
  #shows-container {
    max-width: 900px;
    margin: 20px auto 0;
    width: 100%;
  }

  .show-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 0;
    border-bottom: 1px solid #e5e5e5;
    gap: 20px;
  }

  .show-row:first-child {
    border-top: 1px solid #e5e5e5;
  }

  .show-date {
    width: 120px;
    font-size: 14px;
    color: var(--ink); /* Updated to black */
    flex-shrink: 0;
  }

  .show-info {
    flex-grow: 1;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .show-venue {
    font-size: 16px;
    color: var(--ink);
  }

  .show-location {
    font-size: 13px;
    color: var(--muted);
  }

  .show-details {
    font-size: 12px;
    color: var(--muted);
    font-style: italic;
    margin-top: 2px;
  }

  .show-link-wrap {
    flex-shrink: 0;
  }

  .show-btn {
    display: inline-block;
    padding: 8px 16px;
    border: 1px solid var(--ink);
    color: var(--ink);
    text-decoration: none;
    font-size: 12px;
    transition: background-color 0.2s ease, color 0.2s ease;
  }

  .show-btn:hover {
    background-color: var(--ink);
    color: var(--paper);
  }

  @media (max-width: 600px) {
    .show-row {
      flex-direction: column;
      align-items: flex-start;
      gap: 12px;
    }
    .show-link-wrap {
      width: 100%;
    }
    .show-btn {
      display: block;
      text-align: center;
      width: 100%;
    }
  }

  /* ---------- Contacts Section ---------- */
  #contacts-container {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 32px;
    flex-wrap: wrap;
    padding-top: 60px;
  }

  .contact-item {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    color: var(--ink);
    transition: transform 0.2s ease, opacity 0.2s ease;
  }

  .contact-item:hover {
    transform: scale(1.1);
    opacity: 0.7;
  }

  .contact-item svg {
    width: 28px;
    height: 28px;
    fill: currentColor;
  }

  /* ---------- View Visibility Helper ---------- */
  .view-section {
    display: none;
  }

  .view-section.active {
    display: block;
  }

  #music-container.active {
    display: flex;
  }

  #contacts-container.active {
    display: flex;
  }

  /* ---------- Status ---------- */
  #status {
    text-align: center;
    padding: 60px 20px;
    font-size: 12px;
    color: var(--muted);
  }

  #status.hidden { display: none; }
</style>
</head>
<body>

<header>
  <img id="logo" class="hidden" alt="logo">
  <nav>
    <a id="nav-home" class="active">Home</a>
    <a id="nav-music">Music</a>
    <a id="nav-shows">Shows</a>
    <a id="nav-contacts">Contacts</a>
  </nav>
</header>

<main>
  <p id="status">Loading&nbsp;work&hellip;</p>
  
  <div id="gallery" class="view-section active"></div>
  <div id="music-container" class="view-section"></div>
  <div id="shows-container" class="view-section"></div>
  <div id="contacts-container" class="view-section"></div>
</main>

<script>
  const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/14PGGXxjTjNHJsGwp11z-aQ78AXxMytGQaXIRcbcWHuw/gviz/tq?tqx=out:csv&gid=0";
  const LOGO_SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/14PGGXxjTjNHJsGwp11z-aQ78AXxMytGQaXIRcbcWHuw/gviz/tq?tqx=out:csv&sheet=logos";
  const MUSIC_SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/14PGGXxjTjNHJsGwp11z-aQ78AXxMytGQaXIRcbcWHuw/gviz/tq?tqx=out:csv&sheet=Music";
  const SHOWS_SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/14PGGXxjTjNHJsGwp11z-aQ78AXxMytGQaXIRcbcWHuw/gviz/tq?tqx=out:csv&sheet=shows";
  const CONTACT_SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/14PGGXxjTjNHJsGwp11z-aQ78AXxMytGQaXIRcbcWHuw/gviz/tq?tqx=out:csv&sheet=contact";

  const galleryEl = document.getElementById('gallery');
  const musicContainerEl = document.getElementById('music-container');
  const showsContainerEl = document.getElementById('shows-container');
  const contactsContainerEl = document.getElementById('contacts-container');
  const statusEl = document.getElementById('status');

  let musicLoaded = false;
  let showsLoaded = false;
  let contactsLoaded = false;

  function setStatus(msg) {
    statusEl.textContent = msg;
    statusEl.classList.remove('hidden');
  }

  function hideStatus() {
    statusEl.classList.add('hidden');
  }

  function parseCSV(text) {
    const rows = [];
    let row = [], field = '', inQuotes = false;

    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      const next = text[i + 1];

      if (inQuotes) {
        if (c === '"' && next === '"') { field += '"'; i++; }
        else if (c === '"') { inQuotes = false; }
        else { field += c; }
      } else {
        if (c === '"') inQuotes = true;
        else if (c === ',') { row.push(field); field = ''; }
        else if (c === '\n') { row.push(field); rows.push(row); row = []; field = ''; }
        else if (c === '\r') { /* skip */ }
        else { field += c; }
      }
    }
    if (field.length || row.length) { row.push(field); rows.push(row); }
    return rows.filter(r => r.some(cell => cell.trim() !== ''));
  }

  function rowsToObjects(rows) {
    const header = rows[0].map(h => h.trim().toLowerCase());
    return rows.slice(1).map(r => {
      const obj = {};
      header.forEach((key, i) => { obj[key] = (r[i] || '').trim(); });
      return obj;
    });
  }

  const VIDEO_EXT = /\.(mp4|webm|mov|m4v|ogg)(\?.*)?$/i;
  const YT_PATTERN = /(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/)|youtu\.be\/)([A-Za-z0-9_-]{11})/;

  function getMediaUrl(item) {
    return item['image/video'] || item['image'] || item['video'] || '';
  }

  function isVideo(url) {
    return VIDEO_EXT.test(url) || !!getYouTubeId(url);
  }

  function getYouTubeId(url) {
    const match = url.match(YT_PATTERN);
    return match ? match[1] : null;
  }

  const lazyMediaObserver = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      const target = entry.target;
      if (entry.isIntersecting) {
        if (target.dataset.ytid && !target.dataset.loaded) {
          const ytId = target.dataset.ytid;
          const iframe = document.createElement('iframe');
          iframe.src = 'https://www.youtube.com/embed/' + ytId +
            '?autoplay=1&mute=1&loop=1&playlist=' + ytId +
            '&controls=1&rel=0&modestbranding=1&playsinline=1&enablejsapi=1&cc_load_policy=0';
          iframe.title = target.dataset.caption || 'video';
          iframe.allow = 'autoplay; encrypted-media; picture-in-picture';
          iframe.allowFullscreen = true;
          iframe.classList.add('loaded');
          target.insertBefore(iframe, target.firstChild);
          target.dataset.loaded = "true";
        } else if (target.tagName === 'VIDEO') {
          target.play().catch(() => {});
        }
      } else {
        if (target.tagName === 'VIDEO') {
          target.pause();
        }
      }
    });
  }, { rootMargin: '100px 0px' });

  /* ---------- Home Gallery Loader ---------- */
  function buildGallery(items) {
    galleryEl.innerHTML = '';

    const usable = items
      .map(item => ({ ...item, mediaUrl: getMediaUrl(item) }))
      .filter(item => item.mediaUrl);

    if (!usable.length) {
      setStatus('No photos or videos found. Check that your sheet has an "image/video" column filled in.');
      return;
    }

    usable.forEach(item => {
      const figure = document.createElement('figure');
      const isTextLogo = !isVideo(item.mediaUrl) && !item.link && !item.caption;

      if (isTextLogo) {
        figure.className = 'media-textlogo';
        const img = document.createElement('img');
        img.src = item.mediaUrl;
        img.loading = 'lazy';
        img.referrerPolicy = 'no-referrer';
        img.alt = 'logo';
        img.addEventListener('load', () => img.classList.add('loaded'));
        img.addEventListener('error', () => {
          figure.style.border = '1px dashed #cc3333';
          figure.style.padding = '10px';
          figure.style.fontSize = '11px';
          figure.style.color = '#cc3333';
          figure.textContent = 'Text-logo image failed to load: ' + item.mediaUrl;
        });

        figure.appendChild(img);
        galleryEl.appendChild(figure);
        return;
      }

      if (isVideo(item.mediaUrl)) {
        figure.className = 'media-video';
        const ytId = getYouTubeId(item.mediaUrl);

        if (ytId) {
          const frame = document.createElement('div');
          frame.className = 'video-frame';
          frame.dataset.ytid = ytId;
          frame.dataset.caption = item.caption || '';

          const soundBtn = document.createElement('button');
          soundBtn.className = 'sound-prompt';
          soundBtn.type = 'button';
          soundBtn.textContent = 'Tap for sound';
          soundBtn.addEventListener('click', () => {
            const iframe = frame.querySelector('iframe');
            if (iframe && iframe.contentWindow) {
              iframe.contentWindow.postMessage(
                JSON.stringify({ event: 'command', func: 'unMute', args: [] }), '*'
              );
              iframe.contentWindow.postMessage(
                JSON.stringify({ event: 'command', func: 'playVideo', args: [] }), '*'
              );
            }
            soundBtn.classList.add('hidden');
          });

          frame.appendChild(soundBtn);
          figure.appendChild(frame);
          lazyMediaObserver.observe(frame);
        } else {
          const wrap = document.createElement('div');
          wrap.style.position = 'relative';

          const video = document.createElement('video');
          video.src = item.mediaUrl;
          video.loop = true;
          video.playsInline = true;
          video.preload = 'metadata';
          video.muted = true;
          video.addEventListener('loadeddata', () => video.classList.add('loaded'));

          const soundBtn = document.createElement('button');
          soundBtn.className = 'sound-prompt hidden';
          soundBtn.type = 'button';
          soundBtn.textContent = 'Tap for sound';
          soundBtn.addEventListener('click', () => {
            video.muted = false;
            video.play();
            soundBtn.classList.add('hidden');
          });

          video.play().catch(() => {
            soundBtn.classList.remove('hidden');
          });

          wrap.appendChild(video);
          wrap.appendChild(soundBtn);
          figure.appendChild(wrap);
          lazyMediaObserver.observe(video);
        }
      } else {
        const a = document.createElement('a');
        a.href = item.link || item.mediaUrl;
        a.target = '_blank';
        a.rel = 'noopener noreferrer';

        const img = document.createElement('img');
        img.src = item.mediaUrl;
        img.loading = 'lazy';
        img.referrerPolicy = 'no-referrer';
        img.alt = item.caption || '';
        img.addEventListener('load', () => img.classList.add('loaded'));
        img.addEventListener('error', () => {
          figure.style.background = '#f4f4f4';
          figure.style.border = '1px dashed #cc3333';
          figure.style.padding = '10px';
          figure.style.fontSize = '11px';
          figure.style.color = '#cc3333';
          figure.textContent = 'Image failed to load: ' + item.mediaUrl;
        });

        a.appendChild(img);

        if (item.caption) {
          const overlay = document.createElement('span');
          overlay.className = 'caption-overlay';
          overlay.textContent = item.caption;
          a.appendChild(overlay);
        }

        figure.appendChild(a);
      }

      galleryEl.appendChild(figure);
    });

    hideStatus();
  }

  async function loadGallery() {
    if (!SHEET_CSV_URL || SHEET_CSV_URL.includes('PASTE_YOUR')) {
      setStatus('Add your Google Sheet CSV link in index.html to load photos.');
      return;
    }

    try {
      setStatus('Loading work…');
      const res = await fetch(SHEET_CSV_URL);
      if (!res.ok) throw new Error('Network response was not ok (' + res.status + ')');
      const text = await res.text();
      const rows = parseCSV(text);
      if (!rows.length) throw new Error('Sheet appears empty');
      const items = rowsToObjects(rows);
      buildGallery(items);
    } catch (err) {
      console.error(err);
      setStatus('Could not load photos from the Google Sheet. Check the sharing/publish settings and try again.');
    }
  }

  /* ---------- Music Tab Loader ---------- */
  function buildMusic(items) {
    musicContainerEl.innerHTML = '';

    const usable = items.filter(item => item.cover || item.name);

    if (!usable.length) {
      setStatus('No music entries found in the "Music" sheet tab.');
      return;
    }

    usable.forEach(item => {
      const container = document.createElement('div');
      container.className = 'music-item';

      const link = document.createElement('a');
      link.href = item.link || '#';
      if (item.link) {
        link.target = '_blank';
        link.rel = 'noopener noreferrer';
      }

      if (item.name) {
        const title = document.createElement('div');
        title.className = 'music-title';
        title.textContent = item.name;
        link.appendChild(title);
      }

      if (item.cover) {
        const coverWrap = document.createElement('div');
        coverWrap.className = 'music-cover-wrap';

        const img = document.createElement('img');
        img.className = 'music-cover';
        img.src = item.cover;
        img.loading = 'lazy';
        img.referrerPolicy = 'no-referrer';
        img.alt = item.name || 'music cover';
        img.addEventListener('load', () => img.classList.add('loaded'));

        coverWrap.appendChild(img);
        link.appendChild(coverWrap);
      }

      container.appendChild(link);
      musicContainerEl.appendChild(container);
    });

    hideStatus();
    musicLoaded = true;
  }

  async function loadMusic() {
    try {
      setStatus('Loading music…');
      const res = await fetch(MUSIC_SHEET_CSV_URL);
      if (!res.ok) throw new Error('Network response was not ok (' + res.status + ')');
      const text = await res.text();
      const rows = parseCSV(text);
      if (!rows.length) throw new Error('Music sheet appears empty');
      const items = rowsToObjects(rows);
      buildMusic(items);
    } catch (err) {
      console.error(err);
      setStatus('Could not load music from the "Music" sheet. Ensure the tab exists and contains columns: name, cover, link.');
    }
  }

  /* ---------- Shows Tab Loader ---------- */
  function buildShows(items) {
    showsContainerEl.innerHTML = '';

    const usable = items.filter(item => item.show || item.date || item.location);

    if (!usable.length) {
      setStatus('No upcoming shows found in the "shows" sheet tab.');
      return;
    }

    usable.forEach(item => {
      const row = document.createElement('div');
      row.className = 'show-row';

      const dateEl = document.createElement('div');
      dateEl.className = 'show-date';
      dateEl.textContent = item.date || '';

      const infoEl = document.createElement('div');
      infoEl.className = 'show-info';

      const venueEl = document.createElement('div');
      venueEl.className = 'show-venue';
      venueEl.textContent = item.show || '';

      const locationEl = document.createElement('div');
      locationEl.className = 'show-location';
      locationEl.textContent = item.location || '';

      infoEl.appendChild(venueEl);
      infoEl.appendChild(locationEl);

      if (item.details) {
        const detailsEl = document.createElement('div');
        detailsEl.className = 'show-details';
        detailsEl.textContent = item.details;
        infoEl.appendChild(detailsEl);
      }

      row.appendChild(dateEl);
      row.appendChild(infoEl);

      if (item.link) {
        const linkWrap = document.createElement('div');
        linkWrap.className = 'show-link-wrap';

        const linkBtn = document.createElement('a');
        linkBtn.className = 'show-btn';
        linkBtn.href = item.link;
        linkBtn.target = '_blank';
        linkBtn.rel = 'noopener noreferrer';
        linkBtn.textContent = 'tickets';

        linkWrap.appendChild(linkBtn);
        row.appendChild(linkWrap);
      }

      showsContainerEl.appendChild(row);
    });

    hideStatus();
    showsLoaded = true;
  }

  async function loadShows() {
    try {
      setStatus('Loading shows…');
      const res = await fetch(SHOWS_SHEET_CSV_URL);
      if (!res.ok) throw new Error('Network response was not ok (' + res.status + ')');
      const text = await res.text();
      const rows = parseCSV(text);
      if (!rows.length) throw new Error('Shows sheet appears empty');
      const items = rowsToObjects(rows);
      buildShows(items);
    } catch (err) {
      console.error(err);
      setStatus('Could not load shows from the "shows" sheet. Ensure the tab exists and contains columns: show, date, location, link, details.');
    }
  }

  /* ---------- Contacts Tab Loader ---------- */
  const SOCIAL_ICONS = {
    email: `<svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>`,

  function buildContacts(items) {
    contactsContainerEl.innerHTML = '';

    const usable = items.filter(item => item.social || item.link);

    if (!usable.length) {
      setStatus('No contacts found in the "contact" sheet tab.');
      return;
    }

    usable.forEach(item => {
      const socialKey = (item.social || '').toLowerCase().trim();
      let rawLink = (item.link || '').trim();

      if (!rawLink) return;

      if (socialKey === 'email' && !rawLink.startsWith('mailto:')) {
        rawLink = 'mailto:' + rawLink;
      }

      const a = document.createElement('a');
      a.className = 'contact-item';
      a.href = rawLink;
      a.target = socialKey === 'email' ? '_self' : '_blank';
      if (socialKey !== 'email') a.rel = 'noopener noreferrer';
      a.title = item.social || 'contact';

      const svgCode = SOCIAL_ICONS[socialKey] || SOCIAL_ICONS['default'];
      a.innerHTML = svgCode;

      contactsContainerEl.appendChild(a);
    });

    hideStatus();
    contactsLoaded = true;
  }

  async function loadContacts() {
    try {
      setStatus('Loading contacts…');
      const res = await fetch(CONTACT_SHEET_CSV_URL);
      if (!res.ok) throw new Error('Network response was not ok (' + res.status + ')');
      const text = await res.text();
      const rows = parseCSV(text);
      if (!rows.length) throw new Error('Contact sheet appears empty');
      const items = rowsToObjects(rows);
      buildContacts(items);
    } catch (err) {
      console.error(err);
      setStatus('Could not load contacts from the "contact" sheet. Ensure the tab exists and contains columns: social, link.');
    }
  }

  /* ---------- Header Logo Loader ---------- */
  async function loadLogo() {
    const logoEl = document.getElementById('logo');
    if (!LOGO_SHEET_CSV_URL) return;

    function showLogoError(msg) {
      const errEl = document.createElement('div');
      errEl.style.position = 'absolute';
      errEl.style.left = '20px';
      errEl.style.top = '4px';
      errEl.style.fontSize = '10px';
      errEl.style.color = '#cc3333';
      errEl.style.maxWidth = '260px';
      errEl.style.zIndex = '10';
      errEl.textContent = 'Logo error: ' + msg;
      document.querySelector('header').appendChild(errEl);
    }

    try {
      const res = await fetch(LOGO_SHEET_CSV_URL);
      if (!res.ok) throw new Error('Sheet fetch failed with status ' + res.status);
      const text = await res.text();
      const rows = parseCSV(text);
      if (!rows.length) throw new Error('Logos sheet returned no rows at all');
      const items = rowsToObjects(rows);

      const row2 = items[0];
      if (!row2) throw new Error('No data row found (row 2 is empty)');

      const logoUrl = row2['image link'] || row2['image'] || row2['logo'];
      if (!logoUrl) {
        throw new Error('Row 2 has no "image link" value. Columns found: ' + Object.keys(row2).join(', '));
      }

      logoEl.referrerPolicy = 'no-referrer';
      logoEl.addEventListener('load', () => logoEl.classList.remove('hidden'));
      logoEl.addEventListener('error', () => showLogoError('image tag failed to load ' + logoUrl));
      logoEl.src = logoUrl;
    } catch (err) {
      showLogoError(err.message);
    }
  }

  /* ---------- Navigation Routing ---------- */
  const navHome = document.getElementById('nav-home');
  const navMusic = document.getElementById('nav-music');
  const navShows = document.getElementById('nav-shows');
  const navContacts = document.getElementById('nav-contacts');

  function showSection(sectionName) {
    document.querySelectorAll('nav a').forEach(a => a.classList.remove('active'));
    document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));

    if (sectionName === 'home') {
      navHome.classList.add('active');
      galleryEl.classList.add('active');
      hideStatus();
    } else if (sectionName === 'music') {
      navMusic.classList.add('active');
      musicContainerEl.classList.add('active');
      if (!musicLoaded) {
        loadMusic();
      } else {
        hideStatus();
      }
    } else if (sectionName === 'shows') {
      navShows.classList.add('active');
      showsContainerEl.classList.add('active');
      if (!showsLoaded) {
        loadShows();
      } else {
        hideStatus();
      }
    } else if (sectionName === 'contacts') {
      navContacts.classList.add('active');
      contactsContainerEl.classList.add('active');
      if (!contactsLoaded) {
        loadContacts();
      } else {
        hideStatus();
      }
    }
  }

  navHome.addEventListener('click', (e) => {
    e.preventDefault();
    showSection('home');
  });

  navMusic.addEventListener('click', (e) => {
    e.preventDefault();
    showSection('music');
  });

  navShows.addEventListener('click', (e) => {
    e.preventDefault();
    showSection('shows');
  });

  navContacts.addEventListener('click', (e) => {
    e.preventDefault();
    showSection('contacts');
  });

  // Initial loads
  loadGallery();
  loadLogo();
</script>
